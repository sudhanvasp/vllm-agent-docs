openapi: 3.1.0
info:
  title: vLLM OpenAI-Compatible Server API
  version: "0.29"
  description: >-
    The core endpoints exposed by `vllm serve` — vLLM's HTTP server
    implementing OpenAI's Chat Completions, Completions, Embeddings, and
    Models APIs. This is a hand-authored subset of vLLM's documented API
    surface (Apache-2.0, adapted from
    https://docs.vllm.ai/en/latest/serving/online_serving/openai_compatible_server/),
    scoped to the endpoints covered in [Serve an OpenAI-compatible
    endpoint](/guides/serve-openai-endpoint). It is not machine-generated
    from a running instance: point the server below at your own `vllm
    serve` process, or regenerate this file from your own deployment's
    `/openapi.json` for full, version-exact coverage.
servers:
  - url: http://localhost:8000
    description: A local `vllm serve` instance (see the Quickstart guide)
tags:
  - name: Chat
    description: OpenAI Chat Completions-compatible endpoint.
  - name: Completions
    description: OpenAI legacy Completions-compatible endpoint.
  - name: Embeddings
    description: Generate embedding vectors for text input.
  - name: Models
    description: Discover which model(s) the server is currently serving.
security:
  - bearerAuth: []
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [Chat]
      summary: Create a chat completion
      description: >-
        Generate a model response for a list of chat messages. Compatible
        with the OpenAI Chat Completions API — see [Serve an OpenAI-compatible
        endpoint](/guides/serve-openai-endpoint) for a worked example.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: The generated chat completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '401':
          description: Missing or invalid bearer token (only enforced when the server was started with `--api-key`).
  /v1/completions:
    post:
      operationId: createCompletion
      tags: [Completions]
      summary: Create a completion
      description: >-
        Generate a completion for a raw text prompt. Compatible with
        OpenAI's legacy Completions API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
      responses:
        '200':
          description: The generated completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResponse'
  /v1/embeddings:
    post:
      operationId: createEmbedding
      tags: [Embeddings]
      summary: Create embeddings
      description: Generate embedding vectors for the given input text(s), when serving a pooling model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  example: BAAI/bge-base-en-v1.5
                input:
                  description: A string, or array of strings, to embed.
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
              required: [model, input]
      responses:
        '200':
          description: The generated embeddings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        object:
                          type: string
                          example: embedding
                        index:
                          type: integer
                          example: 0
                        embedding:
                          type: array
                          items:
                            type: number
                  model:
                    type: string
  /v1/models:
    get:
      operationId: listModels
      tags: [Models]
      summary: List models
      description: Return the model(s) this server instance is currently serving.
      security: []
      responses:
        '200':
          description: The served model(s).
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Only enforced when the server is started with `--api-key` or
        `VLLM_API_KEY` is set. Only `/v1`, `/v2`, and `/inference` paths
        require it.
  schemas:
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
          example: user
        content:
          type: string
          example: Who won the 2020 World Series?
      required: [role, content]
    ChatCompletionRequest:
      type: object
      properties:
        model:
          type: string
          example: Qwen/Qwen2.5-1.5B-Instruct
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        max_tokens:
          type: integer
          example: 128
        temperature:
          type: number
          example: 0.7
        top_p:
          type: number
        stream:
          type: boolean
          default: false
      required: [model, messages]
    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
                example: stop
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
    CompletionRequest:
      type: object
      properties:
        model:
          type: string
          example: Qwen/Qwen2.5-1.5B-Instruct
        prompt:
          type: string
          example: San Francisco is a
        max_tokens:
          type: integer
          example: 7
        temperature:
          type: number
          example: 0
        logprobs:
          type: integer
          nullable: true
        stream:
          type: boolean
          default: false
      required: [model, prompt]
    CompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: text_completion
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              text:
                type: string
              finish_reason:
                type: string
                example: length
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
    Model:
      type: object
      properties:
        id:
          type: string
          example: Qwen/Qwen2.5-1.5B-Instruct
        object:
          type: string
          example: model
        owned_by:
          type: string
          example: vllm
